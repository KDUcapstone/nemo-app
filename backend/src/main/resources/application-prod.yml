# ============================================
# application-prod.yml
# - Spring Boot connects to Supabase PostgreSQL.
# - Secrets are injected through deployment environment variables.
# ============================================

spring:
  h2:
    console:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true


app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nemo-backend}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}

  s3:
    bucket: ${AWS_S3_BUCKET:nemo-s3-prod}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ""                    # AWS니까 endpoint 없음
    accessKey: ${AWS_ACCESS_KEY}
    secretKey: ${AWS_SECRET_KEY}
    pathStyle: false
    createBucketIfMissing: false

  public-base-url: ${PUBLIC_BASE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
