# ============================================
# Local PostgreSQL integration profile
# - Select explicitly with SPRING_PROFILES_ACTIVE=local.
# - Keep all credentials outside Git.
# ============================================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate.format_sql: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nemo-backend}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  s3:
    bucket: ${AWS_S3_BUCKET:nemo-s3-prod}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ""
    accessKey: ${AWS_ACCESS_KEY}
    secretKey: ${AWS_SECRET_KEY}
    pathStyle: false
    createBucketIfMissing: false