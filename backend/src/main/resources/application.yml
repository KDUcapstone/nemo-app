# ============================================
# Common application configuration
# - dev is the safe default for local execution.
# - local/prod must be selected explicitly.
# ============================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.nemo.backend: DEBUG

naver:
  openapi:
    local:
      endpoint: https://openapi.naver.com/v1/search/local.json
    reverse:
      endpoint: https://maps.apigw.ntruss.com/map-reversegeocode/v2/gc